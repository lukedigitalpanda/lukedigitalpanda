# ── crm.smallpeice.online → Twenty CRM ───────────────────────────────────────

server {
    listen 80;
    server_name crm.smallpeice.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name crm.smallpeice.online;

    ssl_certificate     /etc/letsencrypt/live/crm.smallpeice.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.smallpeice.online/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:CRM:10m;
    ssl_session_timeout       10m;

    add_header X-Frame-Options            "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options     "nosniff"                         always;
    add_header X-XSS-Protection           "1; mode=block"                   always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

    # Disable upstream compression so sub_filter can modify HTML responses
    proxy_set_header Accept-Encoding "";

    # Smallpeice Trust branding — injected into every HTML page
    # CSS variable names confirmed by inspecting Twenty's live DOM (Task 6)
    sub_filter_once on;
    sub_filter '</head>' '<style>.light,.dark{--t-color-blue:#e91e8c;}.dark{--t-background-primary:#130f40;--t-background-secondary:#1e1966;--t-background-tertiary:#1e1966;--t-accent-primary:#6d28d9;--t-accent-accent9:#e91e8c;}.light{--t-accent-primary:#6d28d9;--t-accent-accent9:#e91e8c;}:root{--theme-dark-background-tertiary:#130f40;--theme-light-background-tertiary:#f3f4f6;}</style></head>';

    location / {
        proxy_pass            http://twenty-server:3000;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_cache_bypass    $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    client_max_body_size 25M;
}
